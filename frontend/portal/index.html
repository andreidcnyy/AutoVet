<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/mobile.css" media="(max-width: 1023px)" />
    <link rel="stylesheet" href="/animations.css" />
    <title>Pet Wellness Animal Clinic</title>
    <script>
      // Offline-first service worker registration + status pill.
      // Purely additive — no React/component code is touched.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!ok) return;

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });

        var pill;
        function ensurePill() {
          if (pill) return pill;
          pill = document.createElement('div');
          pill.id = 'digivet-net-pill';
          pill.style.cssText = [
            'position:fixed','left:50%','top:calc(env(safe-area-inset-top, 0px) + 10px)',
            'transform:translateX(-50%)','z-index:99999','padding:6px 14px',
            'border-radius:999px','font:600 12px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif',
            'color:#fff','box-shadow:0 6px 18px -8px rgba(0,0,0,.35)',
            'transition:opacity 240ms ease, transform 240ms ease','opacity:0','pointer-events:none'
          ].join(';');
          document.body.appendChild(pill);
          return pill;
        }
        function show(text, color) {
          var p = ensurePill();
          p.textContent = text; p.style.background = color; p.style.opacity = '1';
        }
        function hide() { if (pill) pill.style.opacity = '0'; }

        function refresh() {
          if (!navigator.onLine) { show('Offline — changes will sync', '#ef4444'); return; }
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage('queue-count');
            navigator.serviceWorker.controller.postMessage('replay-queue');
          } else { hide(); }
        }
        navigator.serviceWorker.addEventListener('message', function (e) {
          var d = e.data || {};
          if (d.type === 'queue-count') {
            if (d.count > 0) show('Syncing ' + d.count + ' pending…', '#f59e0b'); else hide();
          } else if (d.type === 'queued') {
            show((d.count || 1) + ' pending — will sync', '#f59e0b');
          } else if (d.type === 'syncing') {
            show('Syncing ' + d.count + '…', '#f59e0b');
          } else if (d.type === 'synced') {
            show('Synced', '#10b981'); setTimeout(hide, 1600);
          }
        });
        window.addEventListener('online', refresh);
        window.addEventListener('offline', refresh);
        document.addEventListener('DOMContentLoaded', refresh);
      })();
    </script>
    <script>
      // Global Emergency Error Interceptor
      window.onerror = function(message) {
        if (message.includes('Minified React error #31')) {
          document.body.innerHTML = `
            <div style="font-family:sans-serif; padding:40px; text-align:center; background:#fff1f2; min-height:100vh;">
              <h1 style="color:#e11d48;">Portal Error Detected</h1>
              <p style="color:#4b5563;">The portal crashed while displaying pet or owner information.</p>
              <div style="background:#fff; padding:20px; border-radius:12px; border:1px solid #fda4af; display:inline-block; text-align:left; max-width:600px; margin-top:20px;">
                <p style="font-family:monospace; font-size:12px; color:#9f1239;">${message}</p>
              </div>
              <br/><br/>
              <button onclick="window.location.reload()" style="padding:12px 24px; background:#111827; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Reload Portal</button>
            </div>
          `;
        }
      };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
