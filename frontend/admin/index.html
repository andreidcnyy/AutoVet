<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" id="favicon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/mobile.css" media="(max-width: 1023px)" />
    <link rel="stylesheet" href="/animations.css" />
    <title>AUTOVET</title>
    <script>
      // Offline-first service worker registration + status pill.
      // Purely additive — no React/component code is touched.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        // SWs require localhost or HTTPS; bail silently otherwise.
        var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!ok) return;

        window.addEventListener('load', function () {
          // updateViaCache 'none' stops the browser serving sw.js itself from the
          // HTTP cache, which is how two devices ended up running different
          // service worker versions against the same deployment.
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function () {});
        });

        // Status pill
        var pill;
        function ensurePill() {
          if (pill) return pill;
          pill = document.createElement('div');
          pill.id = 'autovet-net-pill';
          pill.style.cssText = [
            'position:fixed','left:50%','top:calc(env(safe-area-inset-top, 0px) + 10px)',
            'transform:translateX(-50%)','z-index:99999','padding:6px 14px',
            'border-radius:999px','font:600 12px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif',
            'color:#fff','box-shadow:0 6px 18px -8px rgba(0,0,0,.35)',
            'transition:opacity 240ms ease, transform 240ms ease','opacity:0','pointer-events:none'
          ].join(';');
          document.body.appendChild(pill);
          return pill;
        }
        function show(text, color) {
          var p = ensurePill();
          p.textContent = text;
          p.style.background = color;
          p.style.opacity = '1';
        }
        function hide() {
          if (!pill) return;
          pill.style.opacity = '0';
        }

        function refresh() {
          if (!navigator.onLine) {
            show('Offline — changes will sync when reconnected', '#ef4444');
          } else {
            hide();
            if (navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('replay-queue');
            }
          }
        }

        // Only respond to offline/online changes — ignore all sync queue messages.
        window.addEventListener('online', refresh);
        window.addEventListener('offline', refresh);
        document.addEventListener('DOMContentLoaded', refresh);
      })();
    </script>
    <script>
      // Global Emergency Error Interceptor
      window.onerror = function(message, source, lineno, colno, error) {
        if (message.includes('Minified React error #31')) {
          document.body.innerHTML = `
            <div style="font-family:sans-serif; padding:40px; text-align:center; background:#fff1f2; min-height:100vh;">
              <h1 style="color:#e11d48;">System Error Detected</h1>
              <p style="color:#4b5563;">React crashed because it tried to render an object from the backend as a piece of text.</p>
              <div style="background:#fff; padding:20px; border-radius:12px; border:1px solid #fda4af; display:inline-block; text-align:left; max-width:600px; margin-top:20px;">
                <p style="font-family:monospace; font-size:12px; color:#9f1239;">${message}</p>
                <hr/>
                <p style="font-size:14px; color:#6b7280;"><b>Next steps:</b> Try clearing your browser cache and refreshing. If this persists, our team is already tracking this object-rendering issue.</p>
              </div>
              <br/><br/>
              <button onclick="window.location.reload()" style="padding:12px 24px; background:#111827; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Reload Application</button>
            </div>
          `;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
