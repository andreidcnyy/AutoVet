name: CI

on:
  push:
    branches: [Seb1, main]
  pull_request:
    branches: [Seb1, main]

jobs:
  backend:
    name: Backend (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: phar, pdo, mbstring, xml, curl, zip
          coverage: none

      - name: Validate composer.json
        working-directory: backend
        run: composer validate 2>&1; echo "composer validate exit: $?"
        continue-on-error: true

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist 2>&1; echo "composer install exit: $?"
        continue-on-error: true

      - name: Check PHP syntax
        working-directory: backend
        run: |
          error=0
          while IFS= read -r -d '' file; do
            php -l "$file" || error=1
          done < <(find app routes -name "*.php" -print0)
          exit $error

  frontend-portal:
    name: Portal Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/portal/package-lock.json

      - name: Install dependencies
        working-directory: frontend/portal
        run: npm ci

      - name: Build
        working-directory: frontend/portal
        run: npm run build

  frontend-admin:
    name: Admin Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend/admin
        run: npm ci

      - name: Build
        working-directory: frontend/admin
        run: npm run build
