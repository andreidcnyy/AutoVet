; Opcache for the Render image.
;
; The extension is compiled in (see Dockerfile) but was doing nothing in
; production: `php artisan serve` runs under the CLI SAPI, and opcache.enable
; only covers web SAPIs — CLI is gated behind opcache.enable_cli, which
; defaults to 0. So every request re-parsed and re-compiled all ~18.5k PHP
; files in app/ + vendor/. On a 0.1-CPU free instance that is the most
; expensive thing the process does.

opcache.enable=1
opcache.enable_cli=1

; Laravel's hot set is a few thousand files, not the full 18.5k on disk.
; 96MB leaves headroom on a 512MB instance for the PHP process itself and for
; the pandas/scikit-learn subprocess the forecast job spawns, which is the
; largest transient allocation in the container.
opcache.memory_consumption=96
opcache.interned_strings_buffer=12

; 18,504 PHP files across app/ and vendor/. PHP rounds this up to the next
; value in its internal prime table, so this covers the whole tree.
opcache.max_accelerated_files=20000

; The image is immutable — code cannot change between requests — so there is
; no reason to stat every file on every include. This is the single biggest
; contributor to the win. Note the trade-off: editing a PHP file inside a
; running container (via a shell) will have no effect until the process
; restarts. That is already true of a redeploy-based workflow.
opcache.validate_timestamps=0

; JIT is deliberately left off. It pays off on tight numeric loops, not on
; I/O-bound request handling that spends its time waiting on TiDB, and its
; buffer would compete for the same scarce memory. Preload is likewise off:
; it is brittle across Laravel service providers and earns little once
; validate_timestamps is already 0.
