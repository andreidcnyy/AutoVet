; Security hardening for the Render image.
;
; CVE-2026-115560 (disclosed 23 Oct 2026, after the PHP2Shell releases) is an
; RCE with no patched release yet. The PHP team's interim mitigation is to turn
; off session upload progress at the ini level — ini_set() and .user.ini do not
; count. Laravel keeps its own sessions and never reads PHP's upload progress
; data, so nothing in the app depends on it.
;
; Remove this once the base image is on a PHP release that fixes the CVE.
session.upload_progress.enabled=0
